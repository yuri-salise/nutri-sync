services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nutrisync_db}
      POSTGRES_USER: ${DB_USER:-nutrisync_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nutrisync_secure_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutrisync_user} -d ${DB_NAME:-nutrisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-nutrisync_user}:${DB_PASSWORD:-nutrisync_secure_password}@db:5432/${DB_NAME:-nutrisync_db}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-nutrisync_user}:${DB_PASSWORD:-nutrisync_secure_password}@db:5432/${DB_NAME:-nutrisync_db}
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal-net

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    networks:
      - internal-net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - proxy
    networks:
      - internal-net
    profiles:
      - production

volumes:
  db-data:

networks:
  internal-net:
    driver: bridge
